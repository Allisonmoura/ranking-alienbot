<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ALIENBOT • Em manutenção</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;
      font-family:Arial,Helvetica,sans-serif;color:#e9fbff;text-align:center;
      background:radial-gradient(ellipse at 50% 20%,#123f4b,#07121d 55%,#05070e)}
    main{width:min(92%,600px);padding:42px 22px;border:1px solid #326473;
      border-radius:24px;background:#0c1724e8;box-shadow:0 0 55px #17d8ff16}
    .alien{font-size:70px;line-height:1}
    .brand{margin:12px 0 30px;font-weight:900;font-size:20px;letter-spacing:6px;color:#8df1ee}
    .status{display:inline-block;border:1px solid #4299a7;border-radius:100px;
      padding:8px 16px;color:#a5e8ed;font-size:12px;letter-spacing:2px}
    h1{font-size:clamp(30px,5vw,50px);line-height:1.12;margin:26px 0 16px}
    h1 span{color:#60edec}
    p{color:#bfd1dd;line-height:1.65;font-size:16px}
    .back{color:#a6f6d9;font-size:20px;font-weight:bold;margin:27px 0 0}
    footer{margin-top:26px;color:#78949f;font-size:11px;letter-spacing:2px}
  </style>
</head>
<body>
  <main>
    <div class="alien">👽</div>
    <div class="brand">ALIENBOT</div>
    <div class="status">● SISTEMA EM ATUALIZAÇÃO</div>
    <h1>Estamos em <span>manutenção.</span></h1>
    <p>Nossa equipe está preparando melhorias e novidades para a próxima missão.</p>
    <p class="back">🚀 Voltaremos em breve!</p>
    <footer>EQUIPE DE ROBÓTICA • RANKING ALIENBOT</footer>
  </main>
</body>
</html>
